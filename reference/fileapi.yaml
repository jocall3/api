        documentable_id:
          type: string
          format: uuid
          description: The unique identifier for the associated platform entity.
          example: job52f03f7e-79de-4b68-b7ae-2e1c9d2f0a5f
        documentable_type:
          type: string
          enum:
            - file_content
            - analysis_job
            - semantic_ledger_account
          description: The type of the associated entity.
