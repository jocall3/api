    DocumentUploadRequest:
      type: object
      properties:
        documentable_id:
          type: string
          description: >-
            The unique identifier for the entity to associate this document with
            (e.g., FileContent ID, AnalysisJob ID).
          example: job52f03f7e-79de-4b68-b7ae-2e1c9d2f0a5f
        documentable_type:
          type: string
          enum:
            - file_content
            - analysis_job
            - semantic_ledger_account
          description: The type of the associated entity.
          example: analysis_job
        document_type:
          type: string
          nullable: true
          description: >-
            A custom category for this document (e.g., 'audit_log',
            'internal_memo').
          example: audit_log
        file:
          type: string
          format: binary
          description: The binary content of the document to upload.
      required:
        - file
        - documentable_id
        - documentable_type
    PlatformEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: eventc8d9e0f1-2a3b-4c5d-6e7f-8a9b0c1d2e3f
        object:
          type: string
          enum:
            - event
          example: event
        created_at:
          type: string
          format: date-time
          description: Timestamp when the event was logged.
          example: '2023-10-27T10:30:10Z'
        event_name:
          type: string
          enum:
            - file_content.uploaded
            - file_content.ingestion_failed
            - analysis_job.queued
            - analysis_job.processing
            - analysis_job.completed
            - analysis_job.failed
            - semantic_ledger_entry.added
            - semantic_ledger_concept.created
          description: The specific name of the event, indicating the type of activity.
          example: analysis_job.completed
        event_time:
          type: string
          format: date-time
          description: >-
            The precise timestamp when the action or state change represented by
            the event actually occurred.
          example: '2023-10-27T10:45:15Z'
        entity_id:
          type: string
          format: uuid
          nullable: true
          description: The ID of the primary entity involved in the event.
          example: job52f03f7e-79de-4b68-b7ae-2e1c9d2f0a5f
        resource_type:
          type: string
          nullable: true
          description: >-
            The type of resource related to the event (e.g., 'file_content',
            'analysis_job').
          example: analysis_job
        data:
          type: object
          description: >-
            Additional, event-specific JSON data providing more context or
            details.
          additionalProperties: true
          example:
            analysis_duration_ms: 10000
            semantic_entries_generated: 150
      required:
        - id
        - object
        - created_at
        - event_name
        - event_time
    ErrorMessage:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: A machine-readable error code.
                enum:
                  - parameter_invalid
                  - parameter_missing
                  - resource_not_found
                  - unauthorized
                  - forbidden
                  - idempotency_key_conflict
                  - payload_too_large
                  - unsupported_file_type
                  - analysis_failed
                  - invalid_url
                  - entity_already_exists
                example: analysis_failed
              message:
                type: string
                description: A human-readable description of the error.
                example: >-
                  Analysis job for file f123 failed. Sentiment analysis step
                  reported an unrecoverable error.
              parameter:
                type: string
                nullable: true
                description: >-
                  The specific parameter in the request that caused the error
                  (if applicable).
                example: file_url
          description: A list of detailed error objects.
      required:
        - errors
